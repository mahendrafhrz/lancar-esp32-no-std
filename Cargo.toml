[package]
name = "lancar-esp32-no-std"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
esp-backtrace = { version = "0.16.0", features = ["esp32s3", "panic-handler", "exception-handler", "println"] }
esp-hal = { version = "0.23.1", features = ["esp32s3"] }
esp-hal-embassy = { version = "0.6.0", features = ["esp32s3"] }
esp-println = { version = "0.14.0", features = ["esp32s3"] }
esp-alloc = "0.6.0"
esp-wifi = { version = "0.12.0", default-features = false, features = ["esp32s3", "wifi", "esp-alloc"] }
embassy-executor = { version = "0.7.0", default-features = false, features = ["task-arena-size-16384"] }
embassy-time = { version = "0.4.0", default-features = false }
embedded-hal = { version = "1.0.0", default-features = false }
embassy-net = { version = "0.6.0", default-features = false, features = ["dhcpv4", "dns", "tcp", "proto-ipv4", "medium-ethernet"] }
static_cell = "2.1.0"
heapless = { version = "0.8.0", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
